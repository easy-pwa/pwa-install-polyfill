on:
  push:
    branches:
      - main
      - v1
      - '!gh-pages'

jobs:
  deploy-gh-page:
    name: deploy-gh-page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
      - run: npm run build
      - run: cp -r ./dist/* ./demo/
      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./demo
            publish_branch: gh-pages
