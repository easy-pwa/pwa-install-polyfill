on:
  push:
    branches:
      - '*'
      - '!gh-pages'

jobs:
  tests:
    name: tests eslint and jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
      - run: npm run build
      - run: npm run eslint
      - run: npm run jest
